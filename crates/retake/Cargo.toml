[package]
name = "retake"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
retake-audio = { path = "../retake-audio" }
retake-core = { path = "../retake-core" }
tauri-winrt-notification = "0.8.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio", "Win32_System_Ioctl", "Win32_System_IO", "Win32_System_Com", "Win32_System_Pipes"] }

[lints]
workspace = true

[dev-dependencies]
object = { version = "0.40", default-features = false, features = ["read_core", "pe", "std"] }
tempfile = "3.27.0"

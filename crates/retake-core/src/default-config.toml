# Retake configuration.
# Every key is optional: anything you leave out uses the value shown here.
# Unknown keys are errors, so a typo like `pre_rol` fails loudly instead of being ignored.
# Relative paths are resolved against the folder this file is in.

[game]
# Record only while one of these processes is running.
processes     = ["RainbowSix.exe", "RainbowSix_Vulkan.exe"]

[capture]
# Monitor index for ddagrab, or "auto": the monitor Siege's window is on
# (the main monitor until the window appears).
output        = "auto"
# Capture frame rate: 60, 120, 144, 165 or 240, or "auto": the fastest of those
# the monitor shows.
fps           = "auto"
# Hardware encoder: "amf" (AMD), "qsv" (Intel), "nvenc" (NVIDIA), or "auto":
# the one for your GPU.
encoder       = "auto"
# "hevc". ("av1" isn't supported yet: clips can't be saved from it.)
codec         = "hevc"
# Constant QP for I- and P-frames, 0–51, lower is better. qp_i must be <= qp_p.
qp_i          = 16
qp_p          = 18
# Encoder speed/quality trade-off: "speed", "balanced" or "quality".
preset        = "speed"
# CPU priority of the recording ffmpeg: "normal" or "below_normal".
priority      = "normal"
# Where the ring buffer segments go, or "auto": Retake/buffer on the fastest
# local drive with at least 20 GB free. A folder of your own should be on a fast
# NVMe drive outside OneDrive, excluded from Defender real-time scanning,
# e.g. "D:/Retake/buffer".
buffer_dir    = "auto"
# Length of the ring buffer. Must be >= pre_roll + post_roll + 4.
buffer_secs   = 60

[audio]
# Game audio (track 1).
game          = true
# "process": only the game's own sound (Windows 10 2004 or later; older Windows
# falls back to "device"). "device": everything your speakers play.
game_source   = "process"
# Microphone (track 2).
mic           = true
mic_device    = "default"
# Mic noise gate threshold in dB; 0 turns it off.
mic_gate_db   = -50
# Discord as track 3.
comms         = false

[clips]
# Where saved clips go, e.g. "D:/Retake/clips", or "auto": Retake/clips on the
# same drive choice as buffer_dir. Finished clips land in its raw/ folder; tmp/ is
# scratch space while saving.
out_dir       = "auto"
# Seconds kept before and after the trigger.
pre_roll      = 15
post_roll     = 3
# Standard clip and full-buffer hotkeys.
hotkey        = "F9"
hotkey_full   = "Ctrl+F9"
# Play a short sound when a clip is saved.
sound_cue     = true
# Once raw clips take more than this many GB, delete the oldest ones that already
# have a graded version (never ungraded ones). 0 = off.
max_raw_gb    = 0

[autoclip]
# Save a clip automatically on your own kills.
enabled       = true
# x, y, w, h of the kill feed (set by calibration; default assumes 2560x1440).
region        = [1880, 120, 640, 260]
# Template image of your name in the kill feed (set by calibration).
template      = "name.png"
# Match threshold for normalized cross-correlation, 0–1.
threshold     = 0.82
# Kills within this many seconds extend one clip.
merge_window  = 10

[grade]
# Grade every saved clip automatically, after the game closes: "on" or "off".
mode            = "on"
# "save_as": keep the raw clip and write clip_graded.mkv next to it.
# "overwrite": replace the raw clip once the graded one is written and checked.
output          = "save_as"
suffix          = "_graded"
# The look: "builtin" (Retake's Siege look) or a .cube file of your own.
look            = "builtin"
look_strength   = 1.0           # 0 = no look, 1 = full LUT
auto_exposure   = true
exposure_amount = 0.5           # 0–1: how far towards the target levels
auto_white_bal  = true
wb_amount       = 0.3           # 0–1; gains are capped at ±6% anyway
contrast        = 1.12          # S-curve around mid-grey, 1.0–1.3
vibrance        = 0.15          # boosts muted colours more than saturated ones
sharpen         = 0.35          # CAS strength, 0 = off; above 0.4 HUD text looks harsh
hud_mask        = true          # ignore HUD areas when measuring
hud_protect     = true          # keep kill feed and UI colours true
bit_depth       = 10            # 10 = HEVC Main10, 8 = Main

[export]
# "after_game" (30 s after the game closes, never during a match) or "manual"
# (only from the tray).
when            = "after_game"
# Any of "edit" (graded HEVC as MP4), "edit-smooth" (DNxHR HQ), "share" (1080p60
# H.264, audio mixed), "vertical" (1080x1920 centre crop).
presets         = ["edit"]

[motion_blur]
enabled         = false
apply_to        = ["share", "vertical"]   # never "edit": keep slow-mo frames
output_fps      = 60
amount          = 1.0           # 0.2–0.3 low, 0.5 medium, 1.0 normal, >1 heavy
weighting       = "gaussian_sym" # equal | gaussian_sym | pyramid
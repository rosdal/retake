name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test
        run: cargo test --all

      - name: Build
        run: cargo build --release

      - name: Fetch pinned ffmpeg (SHA-256 checked)
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Build r6-dissect (pinned, from source)
        shell: pwsh
        run: ./scripts/build-r6-dissect.ps1

      - name: Sign
        # Runs only when a certificate is configured (Azure Trusted Signing or a PFX secret).
        if: ${{ env.SIGN_PFX != '' }}
        env:
          SIGN_PFX: ${{ secrets.SIGN_PFX }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Where-Object FullName -match 'x64' | Select-Object -Last 1
          foreach ($f in 'target/release/retake.exe', 'third_party/ffmpeg/bin/ffmpeg.exe', 'third_party/ffmpeg/bin/ffprobe.exe', 'third_party/r6-dissect/r6-dissect.exe') {
            & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f
            if ($LASTEXITCODE) { throw "signing $f failed" }
          }

      - name: Assemble zip
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $dir = "retake-$tag-win64"
          New-Item -ItemType Directory -Force "$dir/ffmpeg", "$dir/luts" | Out-Null
          Copy-Item target/release/retake.exe, README.md, LICENSE $dir/
          Copy-Item third_party/ffmpeg/bin/ffmpeg.exe, third_party/ffmpeg/bin/ffprobe.exe "$dir/ffmpeg/"
          Copy-Item third_party/r6-dissect/r6-dissect.exe $dir/
          Copy-Item docs/config.md, docs/troubleshooting.md $dir/
          # retake.exe is a GUI-subsystem exe: wait for it explicitly.
          Start-Process "$dir/retake.exe" -ArgumentList 'write-look', "$dir/luts/siege.cube" -Wait
          if (-not (Test-Path "$dir/luts/siege.cube")) { throw 'siege.cube was not written' }
          ./scripts/third-party-licenses.ps1 -Out "$dir/THIRD_PARTY_LICENSES.txt"
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip"
          $sums = Get-ChildItem $dir -Recurse -File -Include *.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), ($_.FullName.Substring((Resolve-Path $dir).Path.Length + 1)) }
          $sums += "{0}  {1}" -f (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLower(), "$dir.zip"
          $sums | Set-Content SHA256SUMS.txt
          "ZIP=$dir.zip" >> $env:GITHUB_ENV

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = "Portable build: unzip anywhere and run retake.exe. See README.md.`n`nSHA-256:`n``````n$(Get-Content SHA256SUMS.txt -Raw)``````"
          gh release create '${{ github.ref_name }}' $env:ZIP SHA256SUMS.txt --title "Retake ${{ github.ref_name }}" --notes $notes
